<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Sahaay Voice — Multilingual Conversational Voice Assistant with Auto-Language Detection (English, Hindi, Gujarati, Marathi)" />
    <title>Sahaay Voice | Multilingual Conversational Voicebot</title>

    <!-- Tailwind CSS CDN with Forms & Container Queries -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script data-purpose="tailwind-config">
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              govNavy: '#0c2340',
              govNavyLight: '#163155',
              govBlue: '#135c9e',
              govRed: '#e12b38',
              govBorder: '#d1d5db',
              govBg: '#f8fafc',
              flagOrange: '#FF9933',
              flagGreen: '#138808'
            },
            fontFamily: {
              sans: ['Segoe UI', 'Roboto', 'Arial', 'sans-serif']
            }
          }
        }
      }
    </script>
    <style data-purpose="custom-decorations">
      .hero-mask-left {
        clip-path: polygon(0 0, 100% 0, 84% 100%, 0% 100%);
      }
      .hero-mask-right {
        clip-path: polygon(16% 0, 100% 0, 100% 100%, 0% 100%);
      }
      .custom-scroll::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scroll::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
    </style>

    <!-- Material Symbols Outlined -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <!-- Noto Sans Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#f4f6f9] text-gray-800 font-sans antialiased relative min-h-screen flex flex-col justify-between">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
